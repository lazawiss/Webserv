# HTML code defines a web page with a form - collects user input
# when click on submit, form is sent to py script using GET method
// data becomes part of URL as query paramters 
// python script can retrieve and process the data

<!DOCTYPE html>
<html>
   <head>
       <meta charset="UTF-8">
       <title> CGI </title>
   </head>

   <body>
        <form action="File.py" method="get">
            Username: <input type="text" name="username" />
            
            <br />

            Email Address: <input type="email" name="emailaddress" />

            <input type="submit" value="Submit" />
        </form>
   </body>
</html>
