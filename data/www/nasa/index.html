<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image of the Day — NASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stars"></canvas>

<header>
  <p>Daily Transmission — NASA</p>
  <h1>Welcome to your webserver</h1>
  <p>Every day, NASA captures an image of the universe. Here it is.</p>
</header>

<main>
  <section id="card" aria-live="polite">

    <div id="loading">
      <div id="pulse"></div>
      <p>Receiving signal…</p>
    </div>

    <div id="error" class="hidden">
      <p>Signal lost.</p>
      <p id="error-detail">Could not retrieve today's image.</p>
    </div>

    <article id="content" class="hidden">
      <div id="media">
        <img id="apod-image" alt="">
        <iframe id="apod-video" class="hidden" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div id="info">
        <p id="date-row"><span>Date</span> <span id="apod-date"></span></p>
        <h2 id="apod-title"></h2>
        <p id="apod-explanation"></p>
        <p id="credit"><span>Credit</span> <span id="apod-copyright">NASA</span></p>
      </div>
    </article>

  </section>
</main>

<footer>
  <p>Powered by NASA's <a href="https://api.nasa.gov/" target="_blank" rel="noopener">Astronomy Picture of the Day API</a>.</p>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
