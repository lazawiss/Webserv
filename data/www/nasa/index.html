<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image of the Day — NASA</title>
  <link href="https://fonts.googleapis.com">
  <link href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/nasa/style.css">
</head>
<body>

  <canvas id="stars"></canvas>

  <header class="header">
    <p class="subtitle">DAILY TRANSMISSION — NASA</p>
    <h1 class="title">Welcome to your webserver</h1>
    <p class="description">Every day, NASA captures an image of the universe. Here it is.</p>
  </header>

  <main>
    <section id="card" class="card" aria-live="polite">

      <div id="state-loading" class="state">
        <p class="state-detail">Receiving signal…</p>
      </div>

      <div id="state-error" class="state hidden">
        <p class="state-detail">Signal lost.</p>
        <p id="error-detail" class="state-detail">Could not retrieve today's image.</p>
      </div>

      <article id="state-content" class="content hidden">
        <div class="media-frame">
          <img id="apod-image" alt="">
          <iframe id="apod-video" class="hidden" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="information">
          <p class="information-line"><span class="apod-label">Date</span><span id="apod-date"></span></p>
          <h2 id="apod-title" class="apod-title"></h2>
          <p id="apod-explanation" class="apod-explanation"></p>
          <p class="information-line credit"><span class="apod-label">Credit</span><span id="apod-copyright">NASA</span></p>
        </div>
      </article>

    </section>
  </main>

  <footer class="footer">
    <p>Powered by NASA's <a href="https://api.nasa.gov/">Astronomy Picture of the Day API</a>.</p>
  </footer>

  <script src="/nasa/config.js"></script>
  <script src="/nasa/script.js"></script>
</body>
</html>
