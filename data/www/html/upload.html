<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

<body class="upload-page">

    <div class="upload-content">
        <a href="/html/index.html" class="back-link">← retour</a>

        <h1>Envoie une photo.</h1>
        <p class="subtitle">Plus on en a, mieux c'est.</p>

        <div class="upload-section">
            <input type="file" id="photo-input" accept="image/*" class="input">
            <button onclick="uploadPhoto()" class="upload-button" id="upload-btn">
                Envoyer la photo
            </button>

            <div id="upload-status" class="upload-status"></div>

            <div id="preview-container" style="display: none;">
                <img id="preview-image" class="preview-image" alt="Preview">
            </div>
        </div>

        <nav class="nav-links" style="margin-top: 2rem;">
            <a href="/html/gallery.html">Voir la galerie →</a>
        </nav>
    </div>

    <script>
        // Load user email
        const userEmail = localStorage.getItem('userEmail') || 'Unknown';
        document.getElementById('user-email').textContent = `Logged as: ${userEmail}`;

        // Preview selected image
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview-image');
                    const container = document.getElementById('preview-container');
                    preview.src = e.target.result;
                    container.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Upload photo function - MÊME LOGIQUE QUE VOTRE APP REACT NATIVE
        async function uploadPhoto() {
            const fileInput = document.getElementById('photo-input');
            const uploadBtn = document.getElementById('upload-btn');
            const statusDiv = document.getElementById('upload-status');

            if (!fileInput.files[0]) {
                statusDiv.innerHTML = '<span class="error">Please select a photo first!</span>';
                return;
            }

            const formData = new FormData();
            formData.append('photoFromFront', fileInput.files[0]);

            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Uploading...';
            statusDiv.innerHTML = '<span class="loading">Uploading photo...</span>';

            try {

                const request = new Request("/upload", {
                    method: "POST",
                    body: formData,
                });
                console.log("test");
            fetch(request)
            .then(async (response) => {
                console.log("Response status:", response.status);
                console.log("Response headers:", [...response.headers.entries()]);
                
                // Get the raw response text first to see what the server is actually returning
                const responseText = await response.text();
                console.log("Raw response body:", responseText);
                console.log("Response body length:", responseText.length);
                
                if (response.status === 409) {
                    // Handle conflict - file already exists
                    throw new Error(`File already exists on server (409 Conflict)`);
                }
                
                if (response.status !== 201 && response.status !== 200) {
                    throw new Error(`Server returned status ${response.status}: ${responseText}`);
                }
                
                console.log("Upload successful!");
                
                // Check if server sent a Location header (common for uploads)
                const locationHeader = response.headers.get('location');
                console.log("Location header:", locationHeader);
                
                // For empty body responses (like yours), just return success info
                if (responseText.trim() === '') {
                    console.log("Empty response body - upload succeeded");
                    return {
                        status: "success",
                        url: locationHeader || null  // Use location header if available
                    };
                }
                
                // If there's a response body, try to determine what it is
                const contentType = response.headers.get('content-type') || '';
                console.log("Content-Type:", contentType);
                
                if (contentType.includes('application/json')) {
                    try {
                        return JSON.parse(responseText);
                    } catch (e) {
                        console.error("Failed to parse response as JSON:", e);
                        throw new Error("Server returned invalid JSON");
                    }
                } else {
                    // Non-JSON response (like raw file data)
                    console.log("Non-JSON response received");
                    return {
                        status: "success",
                        url: locationHeader || null,
                        note: "Server returned non-JSON response"
                    };
                }
            })
            .then((parsedResponse) => {
                console.log("Parsed response:", parsedResponse);
                
                // Handle successful upload
                statusDiv.innerHTML = '<span class="success">✅ Photo uploaded successfully!</span>';
                
                // If your server returns a URL (either in JSON or Location header), use it
                if (parsedResponse.url) {
                    console.log("Storing photo URL:", parsedResponse.url);
                    const photos = JSON.parse(localStorage.getItem('userPhotos') || '[]');
                    photos.push(parsedResponse.url);
                    localStorage.setItem('userPhotos', JSON.stringify(photos));
                }
                
                // Redirect to gallery after 2 seconds
                setTimeout(() => {
                    window.location.href = 'gallery.html';
                }, 2000);
            })
            .catch((error) => {
                console.error("Upload error:", error);
                
                // Show appropriate error message based on error type
                if (error.message.includes('409')) {
                    statusDiv.innerHTML = '<span class="error">❌ File already exists on server</span>';
                } else if (error.message.includes('504')) {
                    statusDiv.innerHTML = '<span class="error">❌ Upload timed out - please try again</span>';
                } else {
                    statusDiv.innerHTML = '<span class="error">❌ Upload failed - ' + error.message + '</span>';
                }
                
                // Reset button state
                uploadBtn.disabled = false;
                uploadBtn.textContent = '📷 Upload Photo';
            });


                // // MODE SERVEUR

                //     body: formData,
                // });

                

                // console.log("point 0.75");

                // if (data.url) {

                //     const photos = JSON.parse(localStorage.getItem('userPhotos') || '[]');
                //     console.log("apres parse");
                //     photos.push(data.url);

                //     localStorage.setItem('userPhotos', JSON.stringify(photos));
                //     console.log("apres parse");
                //     statusDiv.innerHTML = '<span class="success">✅ Photo uploaded successfully!</span>';

                //     // Redirect to gallery after 2 seconds
                //     setTimeout(() => {
                //         window.location.href = 'gallery.html';
                //     }, 2000);
                // } else {
                //     statusDiv.innerHTML = '<span class="error">❌ Upload failed - no URL returned</span>';
                // }

                // TEST FRONTEND SANS SERVEUR
                /*
                console.log("Upload would work with server");

                    window.location.href = 'gallery.html';
                }, 2000);
                */

            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.innerHTML = '<span class="error">❌ Upload failed - server error</span>';
                
                // Reset button state

                uploadBtn.textContent = '📷 Upload Photo';
            }
        }
    </script>
